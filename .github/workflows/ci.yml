name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # No Ollama or Postgres here: the database tests skip themselves, and the model-backed eval (npm run eval) runs locally.
      # The regression test still checks the committed results in results/ against eval/thresholds.json.
      - run: npm test
